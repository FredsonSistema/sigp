server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Sempre revalidar: a interface muda junto com o repositório.
    add_header Cache-Control "no-cache" always;

    location = / {
        return 302 /agencias.html;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri =404;
    }
}
